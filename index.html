<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Zombie Room Defense</title>
    <style>
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 50% 28%, rgba(30, 64, 175, 0.42), rgba(9, 14, 23, 0.98) 72%),
          #090e17;
        color: #f8fafc;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        transition: opacity 0.28s ease;
      }
      #boot-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .boot-card {
        width: min(400px, 86vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        text-align: center;
        padding: 22px 24px;
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.88);
        border: 2px solid rgba(56, 189, 248, 0.45);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.65);
      }
      .boot-badge {
        font-size: 11px;
        font-weight: 900;
        letter-spacing: 1.4px;
        color: #fde047;
        background: rgba(250, 204, 21, 0.14);
        border: 1px solid rgba(250, 204, 21, 0.45);
        border-radius: 999px;
        padding: 3px 11px;
      }
      .boot-card h1 {
        margin: 2px 0 0 0;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.4px;
        color: #ffffff;
      }
      .boot-sub {
        margin: 0 0 4px 0;
        font-size: 12.5px;
        color: #94a3b8;
        font-weight: 700;
      }
      .boot-bar-track {
        width: 100%;
        height: 11px;
        background: #090e17;
        border: 1.5px solid rgba(148, 163, 184, 0.35);
        border-radius: 999px;
        overflow: hidden;
      }
      #boot-bar-fill {
        width: 6%;
        height: 100%;
        background: linear-gradient(90deg, #38bdf8, #4ade80, #fde047);
        border-radius: 999px;
        transition: width 0.1s ease-out;
      }
      .boot-pct-row {
        width: 100%;
        display: flex;
        justify-content: space-between;
        font-size: 11.5px;
        font-weight: 800;
        color: #cbd5e1;
      }
    </style>
      <meta name="theme-color" content="#090e17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="僵尸防线" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=2" />
    <link rel="manifest" href="./manifest.json?v=2" />
    <script type="module" crossorigin src="./assets/index-AUQRgVj6.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CA3VY-np.css">
  </head>
  <body>
    <div id="game-root">
      <canvas id="game-canvas"></canvas>
      <div id="ui-layer"></div>
      <div id="boot-loader" role="status" aria-live="polite">
        <div class="boot-card">
          <span class="boot-badge">SAS TACTICAL SIEGE</span>
          <h1>ZOMBIE ROOM DEFENSE</h1>
          <p class="boot-sub">Preparing Sector Defenses &amp; Arsenal...</p>
          <div class="boot-bar-track">
            <div id="boot-bar-fill"></div>
          </div>
          <div class="boot-pct-row">
            <span id="boot-status">Loading Tactical Assets</span>
            <span id="boot-pct">6%</span>
          </div>
        </div>
      </div>
      <div id="landscape-guard" class="landscape-guard" aria-hidden="true">
        <div class="landscape-guard-card">
          <div class="rotate-phone-anim" aria-hidden="true">
            <div class="phone-frame">
              <span class="phone-screen-icon">🧟</span>
            </div>
            <span class="rotate-arrow">↻</span>
          </div>
          <h2>Rotate Device to Landscape</h2>
          <p>Widescreen dual-stick controls deliver the best combat experience</p>
          <button id="btn-guard-landscape" class="btn-cartoon btn-yellow" type="button">
            ⛶ Fullscreen &amp; Lock Landscape
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
